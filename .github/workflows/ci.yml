name: Automação de Testes — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes-api:
    name: Testes de API (Petstore)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes de API
        run: python -m pytest tests/api/ -v --tb=short

  testes-web:
    name: Testes Web E2E (SauceDemo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Rodar testes Web (headless)
        run: python -m pytest tests/web/ -v --tb=short
